        sync: false

  - type: web
    name: rmf-order-service
    env: node
    buildCommand: ./build.sh order-service
    startCommand: ./start.sh order-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false

  - type: web
    name: rmf-wallet-service
    env: node
    buildCommand: ./build.sh wallet-service
    startCommand: ./start.sh wallet-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false

  - type: web
    name: rmf-delivery-service
    env: node
    buildCommand: ./build.sh delivery-service
    startCommand: ./start.sh delivery-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false

  - type: web
    name: rmf-notification-service
    env: node
