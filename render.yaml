        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  - type: web
    name: rmf-review-service
    env: node
    buildCommand: ./build.sh review-service
    startCommand: ./start.sh review-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false

  - type: web
    name: rmf-admin-service
    env: node
    buildCommand: ./build.sh admin-service
    startCommand: ./start.sh admin-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false

  - type: web
    name: rmf-frontend
    env: node
    buildCommand: ./build.sh frontend
    startCommand: "cd apps/frontend && npx next start"
    envVars:
      - key: NODE_VERSION
        value: "20"
