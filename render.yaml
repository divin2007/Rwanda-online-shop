services:
  - type: web
    name: rmf-user-service
    env: node
    buildCommand: ./build.sh user-service
    startCommand: ./start.sh user-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN
      - key: GOOGLE_CLIENT_ID
        fromEnv: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        fromEnv: GOOGLE_CLIENT_SECRET
      - key: GOOGLE_CALLBACK_URL
        fromEnv: GOOGLE_CALLBACK_URL
      - key: FRONTEND_URL
        value: "https://www.rwshop.org"

  - type: web
    name: rmf-market-service
    env: node
    buildCommand: ./build.sh market-service
    startCommand: ./start.sh market-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN
      # Required for market list caching (M3 fix — was missing)
      - key: REDIS_URL
        fromEnv: REDIS_URL

  - type: web
    name: rmf-product-service
    env: node
    buildCommand: ./build.sh product-service
    startCommand: ./start.sh product-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: REDIS_URL
        fromEnv: REDIS_URL
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN

  - type: web
    name: rmf-seller-service
    env: node
    buildCommand: ./build.sh seller-service
    startCommand: ./start.sh seller-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN

  - type: web
    name: rmf-rider-service
    env: node
    buildCommand: ./build.sh rider-service
    startCommand: ./start.sh rider-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN

  - type: web
    name: rmf-order-service
    env: node
    buildCommand: ./build.sh order-service
    startCommand: ./start.sh order-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN
      - key: DELIVERY_SERVICE_URL
        value: "https://rmf-delivery-service.onrender.com"
      - key: PRODUCT_SERVICE_URL
        value: "https://rmf-product-service.onrender.com"
      - key: WALLET_SERVICE_URL
        value: "https://rmf-wallet-service.onrender.com"
      - key: MARKET_SERVICE_URL
        value: "https://rmf-market-service.onrender.com"
      # Required for order notifications (M2 fix — was missing, caused silent failures)
      - key: NOTIFICATION_SERVICE_URL
        value: "https://rmf-notification-service.onrender.com"
      # Internal service secret for authenticated microservice-to-microservice calls
      - key: INTERNAL_SERVICE_SECRET
        fromEnv: INTERNAL_SERVICE_SECRET
      - key: PAYPACK_CLIENT_ID
        fromEnv: PAYPACK_CLIENT_ID
      - key: PAYPACK_CLIENT_SECRET
        fromEnv: PAYPACK_CLIENT_SECRET
      - key: PAYPACK_BASE_URL
        value: "https://payments.paypack.rw/api"
      - key: PAYPACK_WEBHOOK_MODE
        value: "production"
      - key: PAYPACK_WEBHOOK_SECRET
        fromEnv: PAYPACK_WEBHOOK_SECRET
      - key: PAYPACK_AUTO_CONFIRM
        value: "false"
      - key: PAYPACK_PLATFORM_PHONE
        fromEnv: PAYPACK_PLATFORM_PHONE
      - key: ALLOW_LEGACY_PAYMENT_GATEWAYS
        value: "false"
      - key: MTN_MOMO_API_KEY
        fromEnv: MTN_MOMO_API_KEY
      - key: MTN_MOMO_USER_ID
        fromEnv: MTN_MOMO_USER_ID
      - key: MTN_MOMO_API_SECRET
        fromEnv: MTN_MOMO_API_SECRET
      - key: MTN_MOMO_TARGET_ENV
        fromEnv: MTN_MOMO_TARGET_ENV
      - key: AIRTEL_MONEY_API_KEY
        fromEnv: AIRTEL_MONEY_API_KEY
      - key: AIRTEL_MONEY_SECRET
        fromEnv: AIRTEL_MONEY_SECRET
      - key: AIRTEL_MONEY_TARGET_ENV
        fromEnv: AIRTEL_MONEY_TARGET_ENV
      # Configurable fraud threshold (MD4 fix)
      - key: FRAUD_HIGH_VALUE_THRESHOLD
        value: "2000000"
      # Configurable delivery fee rate (M9 fix)
      - key: DELIVERY_FEE_PER_5KM
        value: "500"

  - type: web
    name: rmf-wallet-service
    env: node
    buildCommand: ./build.sh wallet-service
    startCommand: ./start.sh wallet-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN
      - key: INTERNAL_SERVICE_SECRET
        fromEnv: INTERNAL_SERVICE_SECRET

  - type: web
    name: rmf-delivery-service
    env: node
    buildCommand: ./build.sh delivery-service
    startCommand: ./start.sh delivery-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN
      # WebSocket CORS — must list all frontend origins (M1 fix)
      - key: ALLOWED_ORIGINS
        value: "https://www.rwshop.org,https://rwshop.org"
      # Needed for delivery→order status sync
      - key: ORDER_SERVICE_URL
        value: "https://rmf-order-service.onrender.com"
      - key: NOTIFICATION_SERVICE_URL
        value: "https://rmf-notification-service.onrender.com"
      - key: INTERNAL_SERVICE_SECRET
        fromEnv: INTERNAL_SERVICE_SECRET

  - type: web
    name: rmf-notification-service
    env: node
    buildCommand: ./build.sh notification-service
    startCommand: ./start.sh notification-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: SENDGRID_API_KEY
        fromEnv: SENDGRID_API_KEY
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN
      - key: INTERNAL_SERVICE_SECRET
        fromEnv: INTERNAL_SERVICE_SECRET

  - type: web
    name: rmf-review-service
    env: node
    buildCommand: ./build.sh review-service
    startCommand: ./start.sh review-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN

  - type: web
    name: rmf-admin-service
    env: node
    buildCommand: ./build.sh admin-service
    startCommand: ./start.sh admin-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET
      - key: CORS_ORIGIN
        fromEnv: CORS_ORIGIN

  - type: web
    name: rmf-frontend
    env: node
    buildCommand: ./build.sh frontend
    startCommand: "cd apps/frontend && npx next start"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_USER_SERVICE_URL
        value: "https://rmf-user-service.onrender.com"
      - key: NEXT_PUBLIC_MARKET_SERVICE_URL
        value: "https://rmf-market-service.onrender.com"
      - key: NEXT_PUBLIC_PRODUCT_SERVICE_URL
        value: "https://rmf-product-service.onrender.com"
      - key: NEXT_PUBLIC_SELLER_SERVICE_URL
        value: "https://rmf-seller-service.onrender.com"
      - key: NEXT_PUBLIC_RIDER_SERVICE_URL
        value: "https://rmf-rider-service.onrender.com"
      - key: NEXT_PUBLIC_ORDER_SERVICE_URL
        value: "https://rmf-order-service.onrender.com"
      - key: NEXT_PUBLIC_WALLET_SERVICE_URL
        value: "https://rmf-wallet-service.onrender.com"
      - key: NEXT_PUBLIC_DELIVERY_SERVICE_URL
        value: "https://rmf-delivery-service.onrender.com"
      - key: NEXT_PUBLIC_NOTIFICATION_SERVICE_URL
        value: "https://rmf-notification-service.onrender.com"
      - key: NEXT_PUBLIC_REVIEW_SERVICE_URL
        value: "https://rmf-review-service.onrender.com"
      - key: NEXT_PUBLIC_ADMIN_SERVICE_URL
        value: "https://rmf-admin-service.onrender.com"
      # Max API retries on network errors (N1 fix — was falling back to hardcoded 2)
      - key: NEXT_PUBLIC_API_MAX_RETRIES
        value: "3"
