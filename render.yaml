services:
  - type: web
    name: rmf-user-service
    env: node
    buildCommand: ./build.sh user-service
    startCommand: ./start.sh user-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-market-service
    env: node
    buildCommand: ./build.sh market-service
    startCommand: ./start.sh market-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-product-service
    env: node
    buildCommand: ./build.sh product-service
    startCommand: ./start.sh product-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REDIS_URL
        fromEnv: REDIS_URL
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-seller-service
    env: node
    buildCommand: ./build.sh seller-service
    startCommand: ./start.sh seller-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-rider-service
    env: node
    buildCommand: ./build.sh rider-service
    startCommand: ./start.sh rider-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-order-service
    env: node
    buildCommand: ./build.sh order-service
    startCommand: ./start.sh order-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-wallet-service
    env: node
    buildCommand: ./build.sh wallet-service
    startCommand: ./start.sh wallet-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-delivery-service
    env: node
    buildCommand: ./build.sh delivery-service
    startCommand: ./start.sh delivery-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-notification-service
    env: node
    buildCommand: ./build.sh notification-service
    startCommand: ./start.sh notification-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SENDGRID_API_KEY
        fromEnv: SENDGRID_API_KEY
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-review-service
    env: node
    buildCommand: ./build.sh review-service
    startCommand: ./start.sh review-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-admin-service
    env: node
    buildCommand: ./build.sh admin-service
    startCommand: ./start.sh admin-service
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        fromEnv: MONGODB_URI
      - key: JWT_SECRET
        fromEnv: JWT_SECRET

  - type: web
    name: rmf-frontend
    env: node
    buildCommand: ./build.sh frontend
    startCommand: "cd apps/frontend && npx next start"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_USER_SERVICE_URL
        value: "https://rmf-user-service.onrender.com"
      - key: NEXT_PUBLIC_MARKET_SERVICE_URL
        value: "https://rmf-market-service.onrender.com"
      - key: NEXT_PUBLIC_PRODUCT_SERVICE_URL
        value: "https://rmf-product-service.onrender.com"
      - key: NEXT_PUBLIC_SELLER_SERVICE_URL
        value: "https://rmf-seller-service.onrender.com"
      - key: NEXT_PUBLIC_RIDER_SERVICE_URL
        value: "https://rmf-rider-service.onrender.com"
      - key: NEXT_PUBLIC_ORDER_SERVICE_URL
        value: "https://rmf-order-service.onrender.com"
      - key: NEXT_PUBLIC_WALLET_SERVICE_URL
        value: "https://rmf-wallet-service.onrender.com"
      - key: NEXT_PUBLIC_DELIVERY_SERVICE_URL
        value: "https://rmf-delivery-service.onrender.com"
      - key: NEXT_PUBLIC_NOTIFICATION_SERVICE_URL
        value: "https://rmf-notification-service.onrender.com"
      - key: NEXT_PUBLIC_REVIEW_SERVICE_URL
        value: "https://rmf-review-service.onrender.com"
      - key: NEXT_PUBLIC_ADMIN_SERVICE_URL
        value: "https://rmf-admin-service.onrender.com"
